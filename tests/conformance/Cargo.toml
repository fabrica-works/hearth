[package]
name = "hearth-conformance-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hearth-protocol-mmdebstrap.workspace = true
hearth-test-mirror.workspace = true
hearth-fake-git.workspace = true
hearth-fake-machine.workspace = true
hearth-protocol-git.workspace = true
hearth-recordings.workspace = true
hearth-git-world.workspace = true
skein-scratch.workspace = true

# Ordinary Rust (programming-model.md, 10.2), so not the step crates' lints.
# tests/clippy.toml bans what would make a run unrepeatable.
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the harness asserts what it relies on by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the tests
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
