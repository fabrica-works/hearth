[package]
name = "hearth-render-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hearth-config-world = { path = "../config" }
hearth-protocol-template.workspace = true
hearth-protocol-config.workspace = true
hearth-protocol-builder.workspace = true
skein-lib.workspace = true
hearth-domain-render.workspace = true
hearth-lib.workspace = true
skein-world.workspace = true

[dev-dependencies]
minijinja = { version = "=2.20.0", features = ["json"] }
skein-heap.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the harness asserts what it relies on by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the tests
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
