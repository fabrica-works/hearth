# Test-time caps doubled provisionally at the user's request, 10-22.
# Slow periods are doubled; terminate-after counts stay fixed, so termination
# deadlines double as well.
# The two test suites (docs/development/workflow.md, section 2): the focused
# one, every test but the fuzzy ones, within 30 seconds; and the fuzzy one, the
# test binaries named fuzzy_* beside each world's focused tests, within 2
# minutes. A suite past its budget fails, naming the tests it stopped; a test
# past its slow period is flagged SLOW as it runs. The profiles outside the
# gate (domain/testing.md, 9.2) come with their tiers, and their binaries join these
# filters' exclusions.
#
# nextest refuses a filter that names a binary no crate has, so until the
# first world's fuzzy test lands the fuzzy profile selects none(), and the
# default profile everything. The landing that adds that test gives both
# profiles their filters, the two lines marked below; scripts/check.sh fails
# it otherwise (workflow.md, section 1).

[profile.default]
default-filter = "not binary(/^fuzzy_/) and not binary(/^conformance_/)"
global-timeout = "30s"
slow-timeout = { period = "1000ms" }

# The worlds' tests first, the longest, then the many short unit tests behind
# them, so that the run ends close to its total over the threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

[profile.fuzzy]
default-filter = "binary(/^fuzzy_/) and not binary(/^conformance_/)"
global-timeout = "120s"
slow-timeout = { period = "10s" }

# Measuring, not gating: no budget. With -j 1, each test's own time:
#   cargo nextest run --workspace --profile measure -j 1
#   cargo nextest run --workspace --profile measure -j 1 --ignore-default-filter -E 'binary(/^fuzzy_/)'
[profile.measure]
default-filter = "not binary(/^conformance_/)"
global-timeout = "2h"
slow-timeout = { period = "120s" }

# heavy cargo nextest run --workspace --profile conformance; HEARTH_RECORD=1 captures.
[profile.conformance]
default-filter = "binary(/^conformance_/)"
global-timeout = "4m"
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 0
fail-fast = false
