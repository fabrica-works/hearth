# Profiles and lints follow skein's docs/foundation/programming-model.md, section 10.

[workspace]
resolver = "3"
members = ["crates/*", "tests/*", "testing/hearth-*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# skein is a git dependency named by its GitHub URL, with no rev, branch or
# tag: Cargo.lock pins it, a repin moves it, and skein's `plan` finds it by
# the source's "/skein.git#" (skein's development.md, sections 5.7 and 9.5):
[workspace.dependencies]
libc = "0.2.186"
hearth-service-builder = { path = "crates/hearth-service-builder" }
hearth = { path = "crates/hearth" }
skein-shell = { git = "https://github.com/forgetic/skein.git" }
hearth-protocol-builder = { path = "crates/hearth-protocol-builder" }
skein-sim = { git = "https://github.com/forgetic/skein.git" }
skein-io = { git = "https://github.com/forgetic/skein.git" }
hearth-client-protocol-records = { path = "crates/hearth-client-protocol-records" }
hearth-recordings = { path = "testing/hearth-recordings" }
hearth-git-world = { path = "tests/git" }
hearth-fake-git = { path = "testing/hearth-fake-git" }
sha1 = "=0.10.7"
hearth-protocol-config = { path = "crates/hearth-protocol-config" }
hearth-fake-mmdebstrap = { path = "testing/hearth-fake-mmdebstrap" }
hearth-fake-machine = { path = "testing/hearth-fake-machine" }
hearth-protocol-tree = { path = "crates/hearth-protocol-tree" }
hearth-domain-builder = { path = "crates/hearth-domain-builder" }
hearth-domain-store = { path = "crates/hearth-domain-store" }
hearth-test-mirror = { path = "testing/hearth-test-mirror" }
skein-scratch = { git = "https://github.com/forgetic/skein.git" }
hearth-domain-render = { path = "crates/hearth-domain-render" }
hearth-protocol-mmdebstrap = { path = "crates/hearth-protocol-mmdebstrap" }
skein-world = { git = "https://github.com/forgetic/skein.git" }
skein-heap = { git = "https://github.com/forgetic/skein.git" }
hearth-lib = { path = "crates/hearth-lib" }
hearth-protocol-template = { path = "crates/hearth-protocol-template" }
skein-lib = { git = "https://github.com/forgetic/skein.git" }
hearth-protocol-git = { path = "crates/hearth-protocol-git" }
skein-json = { git = "https://github.com/forgetic/skein.git" }

# Panics are fail-stop and overflow traps, in every profile. (The test harness
# needs unwinding, so cargo ignores `panic` for test targets.)
[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release]
panic = "abort"
overflow-checks = true

# The lints for the step crates (every domain, protocol and service layer, and
# hearth-lib). Disallowed types, macros and methods are listed in clippy.toml.
# Ordinary Rust (the fakes, the worlds, the binary's shell) declares its own
# [lints] table.
[workspace.lints.rust]
unsafe_code = "deny"                  # and forbid at every step crate's root
elided_lifetimes_in_paths = "deny"    # a type that borrows says so: Reader<'_>
unused_must_use = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
let_underscore_drop = "deny"          # drop explicitly, or bind a name
missing_debug_implementations = "deny" # state is inspectable in tests and traces
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the model.
module_name_repetitions = "allow"     # http::HttpX reads fine next to io::X
missing_errors_doc = "allow"          # errors are enum values, documented on the enum
missing_panics_doc = "allow"          # panics are assertions, named by expect("...")
needless_pass_by_value = "allow"      # cell handlers take the source state by value
single_match_else = "allow"           # a two-armed match on Option is as clear as if let

# programming-model.md, 10.3.
wildcard_enum_match_arm = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
impl_trait_in_params = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# The rest of what the subset leaves out (programming-model.md, 10.3).
disallowed_methods = "deny"           # closure-taking combinators, panicking slice ops, ...
allow_attributes = "deny"             # #[expect(.., reason = "..")], which fails once it is stale
match_wildcard_for_single_variants = "deny"
enum_glob_use = "deny"                # a variant is named with its enum
wildcard_imports = "deny"
panic = "deny"                        # assert!, unreachable!("why") or expect("invariant")
missing_assert_message = "deny"       # an assertion names what it relies on
assertions_on_result_states = "deny"
unused_result_ok = "deny"
let_underscore_untyped = "deny"
mixed_read_write_in_expression = "deny"  # one side effect per statement
infinite_loop = "deny"
empty_drop = "deny"
exit = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"
host_endian_bytes = "deny"            # byte order is chosen, not inherited from the host
fn_to_numeric_cast_any = "deny"
default_numeric_fallback = "deny"     # every integer has a stated width
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"
alloc_instead_of_core = "deny"
partial_pub_fields = "deny"           # a struct is plain data or opaque, not both
mod_module_files = "deny"
tests_outside_test_module = "deny"
iter_over_hash_type = "deny"
